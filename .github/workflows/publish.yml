name: Publish to PyPI

# Triggered by publishing a GitHub Release (tag it first, e.g. `v0.1.0`,
# then "Create release" from that tag). Also runnable manually via
# workflow_dispatch for a dry-run build without publishing.
#
# ---------------------------------------------------------------------------
# ONE-TIME MANUAL SETUP REQUIRED (do this before the first release; nobody
# but the PyPI account owner can do it — it cannot be scripted from here):
#
#   1. Create a PyPI account at https://pypi.org/account/register/ if you
#      don't have one, and verify your email.
#   2. Go to https://pypi.org/manage/account/publishing/ and add a
#      "pending" trusted publisher (works even before the project exists):
#        - PyPI project name:   certus-ai
#        - Owner:               edizkaymaklili-lang
#        - Repository name:     certus
#        - Workflow filename:   publish.yml
#        - Environment name:    pypi
#   3. In this repo's Settings -> Environments, create an environment named
#      `pypi` (optionally with required reviewers, for an extra manual
#      approval gate before every publish).
#
# No PyPI API token is stored anywhere — this uses PyPI's OIDC "Trusted
# Publishing", which is the currently recommended, phishing-resistant way
# to publish from CI. See https://docs.pypi.org/trusted-publishers/
# ---------------------------------------------------------------------------

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate package metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # Only actually publish on a real release, not a manual dry-run.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
