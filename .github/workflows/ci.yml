name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (core + dev)
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: mypy (strict)
        run: mypy

      - name: pytest
        run: pytest -v

  gateway-smoke-test:
    name: FastAPI gateway smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (core + proxy + dev)
        run: pip install -e ".[proxy,dev]"

      - name: Import gateway module
        run: python -c "from certus.proxy.gateway import create_app; from certus.proxy.middleware import CertusGuard; create_app(CertusGuard())"

  edge-extra-test:
    name: Edge pipeline integration test (torch/onnx/onnx2tf/tensorflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PyTorch (CPU-only build)
        # The default Linux torch wheel pulls in the full CUDA toolkit and has
        # been observed to crash with "Fatal Python error: Floating point
        # exception" on GPU-less CI runners. Installing the CPU-only build
        # first (before the `edge` extra, which is satisfied by whatever
        # torch version is already present) avoids both the multi-GB
        # download and the crash.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package (core + edge + dev)
        run: pip install -e ".[edge,dev]"

      - name: Run EdgePackager integration tests (ONNX export + ONNX Runtime INT8 quantization)
        # Excludes the onnx2tf/TFLite conversion tests: TensorFlow Lite's
        # native calibrator reproducibly crashes the process with "Fatal
        # Python error: Floating point exception" (SIGFPE) during INT8
        # calibration specifically on the GitHub Actions ubuntu-latest
        # runner (tensorflow==2.21.0) — independent of model architecture or
        # calibration data, and not reproduced on macOS. This is an upstream
        # native-library/platform issue, not something catchable in Python.
        # See the "Known platform limitation" note in CLAUDE.md.
        run: pytest tests/test_edge_packager_integration.py tests/test_edge_quantize.py -v -k "not tflite"

      - name: Run the Colab training template end to end (ONNX formats only)
        # Uses config.ci.json (target_formats without int8_tflite) for the
        # same reason as the step above. examples/config.json — the one
        # documented for real use — is unaffected and keeps int8_tflite.
        run: |
          python examples/colab_training_template.py \
            --config examples/config.ci.json \
            --output-dir /tmp/certus-ci-run
          test -s /tmp/certus-ci-run/model.onnx
          test -s /tmp/certus-ci-run/model.int8.onnx
          test -s /tmp/certus-ci-run/manifest.json
