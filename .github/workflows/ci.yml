name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint, type-check, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (core + dev)
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: mypy (strict)
        run: mypy

      - name: pytest
        run: pytest -v

  gateway-smoke-test:
    name: FastAPI gateway smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package (core + proxy + dev)
        run: pip install -e ".[proxy,dev]"

      - name: Import gateway module
        run: python -c "from certus.proxy.gateway import create_app; from certus.proxy.middleware import CertusGuard; create_app(CertusGuard())"
